name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake pkg-config \
            qt6-base-dev lcov gcovr libgtest-dev
          # libgtest-dev on Debian/Ubuntu provides sources only; build and install
          if [ -d /usr/src/googletest ]; then
            GTEST_SRC=/usr/src/googletest
          else
            GTEST_SRC=/usr/src/gtest
          fi
          if [ -d "$GTEST_SRC" ]; then
            cd "$GTEST_SRC"
            sudo cmake .
            sudo make
            # copy static libs to system library path so linker can find them
            sudo cp lib/*.a /usr/lib || sudo cp *.a /usr/lib || true
            cd -
          fi

      - name: Configure (with coverage)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests (JUnit)
        run: |
          cd build
          ctest --output-on-failure --no-compress-output -T Test
          # ctest -T Test writes Testing/Temporary/LastTest.log and Test.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/Testing/Temporary

      - name: Generate coverage (gcovr)
        run: |
          cd build
          gcovr -r .. --xml-pretty -o coverage.xml || true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage.xml
